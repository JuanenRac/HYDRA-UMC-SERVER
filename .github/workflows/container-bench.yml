# Calls the reusable workflow of HYDRA-UMC-DEV-SERVER that builds the image of this server (scripts/Dockerfile) from the head of the pull request, starts it as
# a real container and runs its scenarios: the version route without a token, the refusals without a token, with a wrong token and with a wrong password, the
# sign-in of the first administrator and a command to a robot that does not exist. It is a light check on purpose: it runs only when the pull request touches
# what those scenarios cover (the start of the server, the sign-in and the routes, the settings store, the policy, the image and its dependencies), never on a
# push to main, and a second push to the same pull request cancels the run in progress. The called workflow is pinned by commit hash, like every other action of
# the repository.
name: Container bench

on:
  pull_request:
    paths:
      - "src/server.ts"
      - "src/auth.ts"
      - "src/users.ts"
      - "src/routes/**"
      - "src/settingsStore.ts"
      - "src/serverPolicy.ts"
      - "src/securityConfig.ts"
      - "scripts/Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/container-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  bench:
    name: Container bench of the server
    uses: JuanenRac/HYDRA-UMC-DEV-SERVER/.github/workflows/server-bench.yml@5a81f23d2a7f51433a6c89a281be612842386cab
    with:
      server_ref: ${{ github.event.pull_request.head.sha || github.sha }}
