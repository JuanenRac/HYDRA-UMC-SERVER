# =============================================================================
# Started by hand only (workflow_dispatch): it never runs on a push or a pull request. It packs the files of the exact commit it pins as the
# package <project>-<version>.tgz that the HYDRA-UMC updater installs, builds it TWICE on two different runners (x86-64 and arm64) and stops unless both
# give the same bytes, and uploads it with SHA256SUMS and a build manifest as one artifact with a build-provenance attestation.
#
# It holds no key and signs nothing: the package is UNSIGNED. The signature of the package (hydra-pc-pkg/1) is made on the maintainer's machine, from this
# artifact, with the release key that never leaves it. With dry_run on (the default) nothing but the artifact is made; with it off a DRAFT release v<version>
# with the unsigned package is also prepared (it is never published from here, and the build stops if the tag already exists).
# A failed or stuck build writes the Job Summary and opens (or updates) the issue "build-failed"; a later good build closes it.

name: Package build (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check only, no draft release"
        type: boolean
        required: true
        default: true
      ref:
        description: "Branch, tag or commit of this repository"
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: package-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Only the owner starts a build
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository starts a build"; exit 1; }

      - name: Check the inputs
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::the ref has characters that a branch, tag or commit does not have"; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Make sure the commit belongs to the main branch
        shell: bash
        run: |
          set -euo pipefail
          # only code that is already in main is built: a branch or a fork commit that is not in main is refused
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "::error::the commit $(git rev-parse --short HEAD) is not part of the main branch; merge it first"; exit 1; }

      - name: Work out the version and pin the commit
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('hydra-umc.project.json', encoding='utf-8'))['version'])")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::the version $version is not one the updater accepts"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version (raise the version BEFORE the build)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Pack on ${{ matrix.id }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x86-64
            runner: ubuntu-latest
          - id: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact commit that was planned
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Pack the files of the commit
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          git archive --format=tar -o "$RUNNER_TEMP/package.tar" "$SHA"
          python3 - "$RUNNER_TEMP/package.tar" "$GITHUB_WORKSPACE/out/HYDRA-UMC-SERVER-$VERSION.tgz" <<'PY'
          import gzip, shutil, sys
          with open(sys.argv[1], "rb") as source, open(sys.argv[2], "wb") as raw:
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw, compresslevel=9, mtime=0) as target:
                  shutil.copyfileobj(source, target)
          PY
          ls -l out
          tar -tzf "out/HYDRA-UMC-SERVER-$VERSION.tgz" | grep -x "hydra-umc.project.json" >/dev/null

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parts-${{ matrix.id }}
          path: out/HYDRA-UMC-SERVER-${{ needs.plan.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Compare, attest and prepare the draft
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download both packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: parts-*
          path: parts

      - name: Check that both builds are the same bytes
        shell: bash
        run: |
          set -euo pipefail
          name="HYDRA-UMC-SERVER-$VERSION.tgz"
          a="$(sha256sum "parts/parts-x86-64/$name" | cut -d' ' -f1)"
          b="$(sha256sum "parts/parts-arm64/$name" | cut -d' ' -f1)"
          if [ "$a" != "$b" ]; then
            echo "::error::the two builds differ (x86-64 $a, arm64 $b): the package is not reproducible"
            exit 1
          fi
          mkdir files
          cp "parts/parts-x86-64/$name" files/
          echo "reproducible: x86-64 and arm64 give $a"
          echo "### Reproducible: two builds on two runners, same sha256 \`$a\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Write SHA256SUMS and the build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd files
          test "$(ls | wc -l)" -eq 1 || { echo "::error::expected one package"; ls; exit 1; }
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import json, os
          files = []
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.strip().split("  ", 1)
              files.append({"name": name, "sha256": digest, "bytes": os.path.getsize(name)})
          json.dump({
              "schema": "hydra-build/1", "repository": os.environ["GITHUB_REPOSITORY"], "project": "server", "version": os.environ["VERSION"],
              "commit": os.environ["SHA"], "built_on": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "toolchain": "git archive of the commit, gzip level 9 without a time stamp; built twice (x86-64 and arm64) with the same bytes",
              "package_format": "hydra-pc-pkg/1 (unsigned)", "reproducible": True, "signed": False, "files": files,
          }, open("build-manifest.json", "w", encoding="utf-8"), indent=2)
          PY
          cat SHA256SUMS
          { echo "### HYDRA-UMC-SERVER $VERSION (unsigned package)"; sed 's/^/- /' SHA256SUMS; } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            files/*.tgz
            files/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-server-${{ needs.plan.outputs.version }}
          path: files/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify the artifact as a stranger would
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNER: ${{ github.repository }}/.github/workflows/package-build.yml
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-server-${{ needs.plan.outputs.version }}
          path: build

      - name: Check hashes, manifest, contents and attestation
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, tarfile
          manifest = json.load(open("build-manifest.json", encoding="utf-8"))
          assert manifest["signed"] is False and manifest["reproducible"] is True and len(manifest["files"]) == 1, "unexpected manifest"
          name = manifest["files"][0]["name"]
          with tarfile.open(name, "r:gz") as archive:
              members = archive.getmembers()
              assert all(m.isfile() or m.isdir() for m in members), "the package has something that is not a file or a folder"
              assert all(not m.name.startswith(("/", "..")) and ".." not in m.name.split("/") for m in members), "a path leaves the package"
              inner = json.load(archive.extractfile("hydra-umc.project.json"))
          assert inner["version"] == manifest["version"], "the version inside the package is not the one of the manifest"
          print("manifest ok:", manifest["project"], manifest["version"], len(members), "entries")
          PY
          for file in *.tgz SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-digest "$GITHUB_SHA" >/dev/null
            echo "attestation ok: $file"
          done

  draft:
    name: Prepare the draft release (owner approval)
    needs: [plan, collect, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Only the owner prepares a draft
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository prepares a draft"; exit 1; }

      - name: Download the verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-server-${{ needs.plan.outputs.version }}
          path: files

      - name: Prepare the draft release with the unsigned package
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the release $tag already exists: raise the version before a new build"
            exit 1
          fi
          gh release create "$tag" files/* --draft --target "$SHA" --title "HYDRA-UMC-SERVER $VERSION (unsigned package)" \
            --notes "Unsigned package made by GitHub Actions. The signed package of the release replaces it."
          echo "- draft release \`$tag\` prepared with the unsigned package" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Tell the owner (issue build-failed)
    if: ${{ always() }}
    needs: [plan, build, collect, verify, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ needs.plan.result }} ${{ needs.build.result }} ${{ needs.collect.result }} ${{ needs.verify.result }}
      DRAFT: ${{ needs.draft.result }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label build-failed --state open --json number --jq '.[0].number // empty')"
          bad=""
          for r in $RESULTS; do [ "$r" = "success" ] || bad="$bad $r"; done
          # the draft job is skipped on purpose in a dry run; in any other case it must have passed
          if [ "$DRAFT" != "success" ] && ! { [ "$DRAFT" = "skipped" ] && [ "$DRY_RUN" = "true" ]; }; then bad="$bad draft:$DRAFT"; fi
          if [ -n "$bad" ]; then
            body="The build failed (plan / build / collect / verify: $RESULTS, draft: $DRAFT; anything but success counts as a failure: failure, timed out, cancelled or skipped). Run: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "A build in GitHub Actions failed" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label build-failed --title "Build failed" --body "$body"
            fi
            echo "### The build failed: issue build-failed updated" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "A later build passed: $RUN_URL"
          fi

      - name: The notice itself failed
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::The build did not pass (${RESULTS}) and the issue build-failed could not be written. Run: ${RUN_URL}"
          echo "### The build did not pass and the issue could not be written" >> "$GITHUB_STEP_SUMMARY"
          echo "Results: ${RESULTS}. Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
