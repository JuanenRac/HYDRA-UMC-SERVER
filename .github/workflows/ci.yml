name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out HYDRA-UMC-SDK contract client
        if: ${{ hashFiles('tools/verify_discovery_contract.mjs') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/HYDRA-UMC-SDK
          ref: v0.6.1
          path: .hydra-umc-sdk-contract
          persist-credentials: false
      - name: Check out HYDRA-UMC-VOICE-UI relay gateway
        if: ${{ hashFiles('tools/verify_voice_relay_contract.mjs') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/HYDRA-UMC-VOICE-UI
          ref: main
          path: .hydra-umc-voice-ui-contract
          persist-credentials: false
      - name: Check out HYDRA-UMC-CONNECTOR-HUB adapter catalog
        if: ${{ hashFiles('tools/verify_connector_hub_relay_contract.mjs') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/HYDRA-UMC-CONNECTOR-HUB
          ref: main
          path: .hydra-umc-connector-hub-contract
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          node-checks: none
      # The Node checks keep steps of their own: the checkouts above and the environment the contract tests read.
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - name: Validate Node.js or TypeScript project
        if: ${{ hashFiles('package.json') != '' }}
        env:
          HYDRA_UMC_SDK_ROOT: ${{ github.workspace }}/.hydra-umc-sdk-contract
          HYDRA_UMC_VOICE_UI_ROOT: ${{ github.workspace }}/.hydra-umc-voice-ui-contract
          HYDRA_UMC_CONNECTOR_HUB_ROOT: ${{ github.workspace }}/.hydra-umc-connector-hub-contract
        run: |
          npm ci --ignore-scripts
          npm run typecheck --if-present
          # The Voice UI and Connector Hub relay contracts each start a real
          # Python service from Node. Resolve the interpreter in this Bash
          # step, where actions/setup-python has configured it, then pass its
          # concrete path to the child-process tests instead of relying on
          # Node PATH.
          PYTHON="$(command -v python)"
          test -n "$PYTHON"
          test -x "$PYTHON"
          echo "VOICE_RELAY_PYTHON=$PYTHON"
          PYTHON="$PYTHON" npm test --if-present
          npm run lint --if-present
      - name: Measure the coverage of the unit tests and keep the floor
        if: ${{ hashFiles('package.json') != '' }}
        env:
          HYDRA_UMC_SDK_ROOT: ${{ github.workspace }}/.hydra-umc-sdk-contract
          HYDRA_UMC_VOICE_UI_ROOT: ${{ github.workspace }}/.hydra-umc-voice-ui-contract
          HYDRA_UMC_CONNECTOR_HUB_ROOT: ${{ github.workspace }}/.hydra-umc-connector-hub-contract
        run: |
          FILES="$(node -e "console.log(require('./package.json').scripts['test:unit'].split(' ').filter(a => a.startsWith('tests/')).join(' '))")"
          npx tsx --test --experimental-test-coverage $FILES > "$RUNNER_TEMP/coverage.txt" 2>&1 || true
          grep -E "^# (tests|pass|fail)|all files|^# (file|---)|\.ts +\|" "$RUNNER_TEMP/coverage.txt" | grep -v "tests/" | head -400
          {
            echo "### Unit test coverage (report only)"
            echo '```'
            grep -E "^# (tests|pass|fail)|all files" "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The floor is the measured value, rounded down: it may rise, never fall.
          LINE=$(grep -E "all files" "$RUNNER_TEMP/coverage.txt" | awk -F'|' '{gsub(/ /,"",$2); gsub(/ /,"",$3); gsub(/ /,"",$4); print $2" "$3" "$4}')
          echo "lines/branches/functions: $LINE"
          test -n "$LINE"
          echo "$LINE" | awk '{ if ($1 < 94 || $2 < 92 || $3 < 93) { print "coverage is under the floor (94 lines, 92 branches, 93 functions)"; exit 1 } }'
      - name: Validate HYDRA-UMC-SERVER admin UI
        if: ${{ hashFiles('admin-ui/package.json') != '' }}
        working-directory: admin-ui
        run: |
          npm ci --ignore-scripts
          npm run typecheck --if-present
          npm test --if-present
          npm run lint --if-present