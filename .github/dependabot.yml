version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/admin-ui"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      npm_updates:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      github_actions_updates:
        patterns:
          - "*"
